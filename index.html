<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивное голосование</title>

<style>
body {
  margin: 0;
  padding: 40px;
  font-family: Arial, sans-serif;
  background: white;
  color: #111;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.question {
  font-size: 24px;
  margin-bottom: 35px;
}

.total {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 30px;
}

.option {
  margin-bottom: 25px;
}

.name {
  display: flex;
  justify-content: space-between;
  font-size: 22px;
  margin-bottom: 8px;
}

.background {
  height: 45px;
  background: #eeeeee;
  border-radius: 12px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #4f46e5;
  border-radius: 12px;
  transition: width 0.5s;
}

.status {
  margin-top: 30px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

<h1>Интерактивное голосование</h1>

<div class="question">
Какой формат вы бы выбрали?
</div>

<div class="total" id="total">
Всего голосов: 0
</div>

<div id="chart"></div>

<div class="status" id="status">
Подключение к голосованию...
</div>

</div>

<script>

const publishedUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSU5uTXyZ2d168T3kt5_kKPfKHA7MsnZVi28wZpwSmyCIyuaU-U2ApCYA-ABlxkHju8xAfgotiKJg_E/pubhtml?gid=997047068&single=true";

const options = [
  "Текст",
  "Карта",
  "3D - модель",
  "Игра"
];

function drawChart(values) {

  const chart = document.getElementById("chart");

  chart.innerHTML = "";

  let total = 0;

  options.forEach(option => {
    total += values[option] || 0;
  });

  document.getElementById("total").textContent =
    "Всего голосов: " + total;

  const max = Math.max(
    ...options.map(option => values[option] || 0),
    1
  );

  options.forEach(option => {

    const count = values[option] || 0;

    const width = (count / max) * 100;

    const element = document.createElement("div");

    element.className = "option";

    element.innerHTML = `
      <div class="name">
        <span>${option}</span>
        <strong>${count}</strong>
      </div>

      <div class="background">
        <div class="bar" style="width:${width}%"></div>
      </div>
    `;

    chart.appendChild(element);
  });

  document.getElementById("status").textContent =
    "Голоса обновляются автоматически";
}

async function update() {

  try {

    const response = await fetch(publishedUrl, {
      cache: "no-store"
    });

    const html = await response.text();

    const values = {};

    options.forEach(option => {

      const index = html.indexOf(option);

      if (index !== -1) {

        const after = html.substring(index);

        const numbers =
          after.match(/>\s*(\d+)\s*</g);

        if (numbers && numbers.length > 0) {

          const number =
            parseInt(
              numbers[0]
                .replace(/>/g, "")
                .replace(/</g, "")
                .trim()
            );

          values[option] = number;
        }
      }

      if (values[option] === undefined) {
        values[option] = 0;
      }

    });

    drawChart(values);

  } catch (error) {

    document.getElementById("status").textContent =
      "Ожидание данных...";

    console.log(error);
  }
}

update();

setInterval(update, 3000);

</script>

</body>
</html>
