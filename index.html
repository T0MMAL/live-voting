<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивное голосование</title>

<style>
body {
  margin: 0;
  padding: 40px;
  font-family: Arial, sans-serif;
  background: white;
  color: #111;
}

.container {
  max-width: 1000px;
  margin: auto;
}

h1 {
  font-size: 42px;
}

.question {
  font-size: 24px;
  margin-bottom: 30px;
}

.total {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 30px;
}

.option {
  margin-bottom: 25px;
}

.name {
  display: flex;
  justify-content: space-between;
  font-size: 22px;
  margin-bottom: 8px;
}

.background {
  height: 45px;
  background: #eeeeee;
  border-radius: 12px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: #4f46e5;
  border-radius: 12px;
  transition: width 0.5s;
}

.status {
  margin-top: 30px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

<h1>Интерактивное голосование</h1>

<div class="question">
Какой формат вы бы выбрали?
</div>

<div class="total" id="total">
Всего голосов: 0
</div>

<div id="chart"></div>

<div class="status" id="status">
Подключение...
</div>

</div>

<script>

const apiUrl =
"https://script.google.com/macros/s/AKfycbyTL1vGOSiZoIhXA8pdNY4x5Ncs8hxNt4eZbnD0o47iT0nMF78ajh-OFywazEAFTmA/exec";

const options = [
  "Текст",
  "Карта",
  "3D - модель",
  "Игра"
];

async function update() {

  try {

    const response = await fetch(apiUrl + "?t=" + Date.now());

    const votes = await response.json();

    let total = 0;

    options.forEach(option => {
      total += Number(votes[option]) || 0;
    });

    document.getElementById("total").textContent =
      "Всего голосов: " + total;

    const max = Math.max(
      ...options.map(option => Number(votes[option]) || 0),
      1
    );

    const chart = document.getElementById("chart");

    chart.innerHTML = "";

    options.forEach(option => {

      const count = Number(votes[option]) || 0;

      const width = (count / max) * 100;

      chart.innerHTML += `
        <div class="option">
          <div class="name">
            <span>${option}</span>
            <strong>${count}</strong>
          </div>

          <div class="background">
            <div class="bar" style="width:${width}%"></div>
          </div>
        </div>
      `;

    });

    document.getElementById("status").textContent =
      "Обновляется автоматически каждые 3 секунды";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Не удалось получить данные";

  }
}

update();

setInterval(update, 3000);

</script>

</body>
</html>
